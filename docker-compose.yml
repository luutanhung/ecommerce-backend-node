services:
  mongodb:
    image: mongo:8

    container_name: ecommerce-backend-mongodb

    restart: unless-stopped

    command:
      - --replSet
      - rs0
      - --bind_ip_all

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'rs.initiate().ok || rs.status().ok' | mongosh --quiet",
        ]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s

    networks:
      - ecommerce-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-backend-node

    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy

    env_file:
      - .env.production

    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - ecommerce-network

volumes:
  mongodb_data:

networks:
  ecommerce-network:
    driver: bridge

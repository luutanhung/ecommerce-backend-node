services:
  mongodb:
    image: mongo:8

    command: ["--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    heathcheck:
      test: echo 'rs.initiate().ok || rs.status().ok' | mongosh --quiet
      interval: 5s
      timeout: 30s
      retries: 30

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: >
      redis-server
      --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb_data:

  redis_data:

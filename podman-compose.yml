services:
  mongodb:
    image: mongo:8

    command: ["--replSet", "rs0", "--bind_ip_all"]

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    heathcheck:
      test: echo 'rs.initiate().ok || rs.status().ok' | mongosh --quiet
      interval: 5s
      timeout: 30s
      retries: 30

volumes:
  mongodb_data:
